name: Build Android APK

on:
  push:
    paths:
      - 'glimpse/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: glimpse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glimpse/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npx eslint src

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: glimpse/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Glimpse.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Glimpse-apk
          path: glimpse/dist/Glimpse.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glimpse-v1.0.${{ github.run_number }}
          name: Glimpse v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Android APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Install:** download `Glimpse.apk` on your Android phone, open it, and allow "Install unknown apps" when asked.
            Log in with the demo account `alex.codes` / `password`, or sign up with a new one.
          files: glimpse/dist/Glimpse.apk
